services:
  - type: web
    name: fieldops-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fieldops-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: STORAGE_PATH
        value: /app/uploads
      - key: UPLOAD_MAX_BYTES
        value: "10485760"
      - key: SEED_DEMO
        value: "true"

databases:
  - name: fieldops-db
    plan: free
    databaseName: fieldops
    user: fieldops
