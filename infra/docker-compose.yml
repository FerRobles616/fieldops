services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fieldops
      POSTGRES_PASSWORD: fieldops
      POSTGRES_DB: fieldops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldops -d fieldops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://fieldops:fieldops@db:5432/fieldops
      SECRET_KEY: dev-secret-change-me-0123456789abcdef
      CORS_ORIGINS: "*"
      STORAGE_PATH: /app/uploads
      SEED_DEMO: "true"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
